name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Byte-compile every module
        run: python -m compileall -q $(git ls-files '*.py')

      - name: Lint for real errors
        run: ruff check --select E9,F63,F7,F82 $(git ls-files '*.py')

      - name: Unit tests
        run: pytest tests/ -q
